[workspace]
resolver = "3"

[package]
name = "ys-e01-parser"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
authors = ["Elijah Brigham", "Zach Mathis (@yamatosecurity)"]
description = "Read-only reader of EWF (E01, Ex01, L01) forensic images, used by Juntei"
license = "(RPL-1.5 OR AGPL-3.0-only) AND Apache-2.0"
readme = "README.md"
repository = "https://github.com/Yamato-Security/ys-e01-parser"
homepage = "https://github.com/Yamato-Security/ys-e01-parser"
keywords = ["ewf", "e01", "forensics", "image", "evidence"]
categories = ["parser-implementations", "filesystem"]
publish = false

[lib]
name = "ewf_image"

[features]
default = ["verify"]
verify = []
# Writing EWF images and acquiring devices: the tests build their images with it; readers of
# evidence (Juntei) leave it off.
writer = []
parallel = ["verify", "dep:rayon"]
serde = ["dep:serde"]
external-fixtures = []
fuzzing = []

[[example]]
name = "sequential"
required-features = ["verify", "writer"]

[[example]]
name = "write_image"
required-features = ["writer"]

[[example]]
name = "write_logical"
required-features = ["writer"]

[[example]]
name = "catalog_scale"
required-features = ["writer"]

[[test]]
name = "acquisition"
required-features = ["writer"]

[[test]]
name = "api"
required-features = ["writer"]

[[test]]
name = "corpus"
required-features = ["writer"]

[[test]]
name = "encryption"
required-features = ["writer"]

[[test]]
name = "reader"
required-features = ["writer"]

[[test]]
name = "reader_performance"
required-features = ["writer"]

[[test]]
name = "recovery"
required-features = ["writer"]

[[test]]
name = "sequential"
required-features = ["writer"]

[[test]]
name = "sources"
required-features = ["writer"]

[[test]]
name = "verification"
required-features = ["writer"]

[[test]]
name = "writer"
required-features = ["writer"]

[[test]]
name = "lenient"
required-features = ["writer"]

[dependencies]
aes = "0.9"
bzip2 = "0.6"
ctr = "0.10"
encoding_rs = "0.8"
flate2 = "1"
lru = "0.18"
md-5 = "0.11"
ruzstd = "0.9"
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = { level = "deny", priority = 1 }
warnings = "deny"
missing_docs = "deny"
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
cargo_common_metadata = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
missing_const_for_fn = { level = "allow", priority = 1 }
option_if_let_else = { level = "allow", priority = 1 }
redundant_pub_crate = { level = "allow", priority = 1 }
significant_drop_tightening = { level = "allow", priority = 1 }
use_self = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
format_push_string = { level = "allow", priority = 1 }
format_collect = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
items_after_statements = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
manual_let_else = { level = "allow", priority = 1 }
