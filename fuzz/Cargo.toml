[package]
name = "ys-e01-parser-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ys-e01-parser = { path = "..", features = ["fuzzing", "writer"] }
tempfile = "3"

[workspace]
members = ["."]

[[bin]]
name = "ewf_read"
path = "fuzz_targets/ewf_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ewf_catalog"
path = "fuzz_targets/ewf_catalog.rs"
test = false
doc = false
bench = false
